<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gym Timer</title>
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Temporizador de descansos para entrenar. Sin registro, sin anuncios.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0b0d10;
    --card:#171b21;
    --card-2:#1e232b;
    --line:#2a313b;
    --txt:#f2f5f8;
    --dim:#8b95a3;
    --work:#b6ff3a;
    --warn:#ffb020;
    --gap:clamp(6px,1.1vmin,12px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    position:fixed;inset:0;width:100%;
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  #app{
    height:100%;
    display:flex;flex-direction:column;gap:var(--gap);
    padding:calc(var(--gap) + env(safe-area-inset-top)) calc(var(--gap) + env(safe-area-inset-right)) calc(var(--gap) + env(safe-area-inset-bottom)) calc(var(--gap) + env(safe-area-inset-left));
    max-width:1200px;margin:0 auto;width:100%;
  }

  /* ---------- barra superior ---------- */
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);flex:0 0 auto}
  .ctrl{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    display:flex;align-items:center;justify-content:space-between;
    padding:clamp(4px,.8vmin,8px) clamp(6px,1vmin,10px);
    gap:4px;min-height:clamp(46px,7.5vmin,64px);
  }
  .lbl{font-size:clamp(9px,1.5vmin,12px);letter-spacing:.14em;color:var(--dim);font-weight:700}
  .val{font-size:clamp(16px,3vmin,24px);font-weight:800;line-height:1;min-width:3.2em;text-align:center}
  .val.off{color:var(--dim);font-weight:700}
  .mid{display:flex;flex-direction:column;align-items:center;gap:2px}
  .step{
    width:clamp(32px,5.2vmin,44px);height:clamp(32px,5.2vmin,44px);flex:0 0 auto;
    border:0;border-radius:11px;background:var(--card-2);color:var(--txt);
    font-size:clamp(17px,2.8vmin,23px);font-weight:700;line-height:1;cursor:pointer;
  }
  .step:active{background:#333c48;transform:scale(.94)}
  /* botón de probar sonido, ocupa toda su celda */
  button.ctrl{width:100%;cursor:pointer;justify-content:center;font:inherit}
  button.ctrl:active{background:var(--card-2)}
  button.ctrl.ko{border-color:#7a2d38;background:#2a1a1e}
  button.ctrl.ok{border-color:var(--work)}
  #sndTxt{font-size:clamp(12px,2.1vmin,17px);font-weight:800;letter-spacing:.02em;white-space:nowrap}

  /* ---------- rejilla de descansos ---------- */
  .grid{
    flex:1 1 auto;display:grid;gap:var(--gap);min-height:0;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
  }
  @media (orientation:landscape){
    .grid{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr)}
  }
  .t{
    border:1px solid var(--line);border-radius:16px;background:var(--card);
    color:var(--txt);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;line-height:1;
    font-size:clamp(22px,min(9vw,6.4vh),58px);
    letter-spacing:-.02em;
    transition:transform .06s ease, background .12s ease;
  }
  .t:active{transform:scale(.96);background:var(--work);color:#0b0d10;border-color:var(--work)}

  /* ---------- pantalla de descanso ---------- */
  .run{
    position:fixed;inset:0;background:var(--bg);z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2.5vmin,24px);
    --ring:min(70vmin,520px);
    padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px);
  }
  .run[hidden]{display:none}
  .phase{
    font-size:clamp(13px,2.6vmin,20px);font-weight:800;letter-spacing:.2em;
    color:var(--dim);text-transform:uppercase;text-align:center;
  }
  .phase b{color:var(--acc,var(--work))}
  .ring{
    width:var(--ring);aspect-ratio:1;border-radius:50%;
    background:conic-gradient(var(--acc,var(--work)) calc(var(--p,1)*360deg), #202832 0);
    display:grid;place-items:center;
  }
  .ring .in{
    width:88%;height:88%;border-radius:50%;background:var(--bg);
    display:grid;place-items:center;
  }
  .big{
    font-size:calc(var(--ring) * .30);font-weight:800;letter-spacing:-.04em;line-height:1;
    color:var(--acc,var(--work));
  }
  .big.go{font-size:calc(var(--ring) * .34)}
  .hint{font-size:clamp(12px,2.2vmin,17px);color:var(--dim);font-weight:600;letter-spacing:.04em}
  .stop{
    position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 12px);
    width:clamp(42px,6.5vmin,56px);height:clamp(42px,6.5vmin,56px);
    border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--txt);
    font-size:clamp(18px,3vmin,24px);line-height:1;cursor:pointer;z-index:11;
  }
  .stop:active{background:#3a2226;border-color:#7a2d38}
  .paused .big{opacity:.42}
</style>
</head>
<body>

<div id="app">
  <div class="bar">
    <div class="ctrl">
      <button class="step" data-d="-1" aria-label="menos series">−</button>
      <div class="mid"><span class="lbl" id="lS">SERIES</span><span class="val off" id="vS">OFF</span></div>
      <button class="step" data-d="1" aria-label="más series">+</button>
    </div>
    <button class="ctrl" id="snd"><span class="mid"><span class="lbl">TOCA PARA</span><span id="sndTxt">🔊 PROBAR</span></span></button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="run" id="run" hidden>
  <button class="stop" id="stop" aria-label="parar">✕</button>
  <div class="phase" id="phase">DESCANSO</div>
  <div class="ring" id="ring"><div class="in"><div class="big" id="big">00:00</div></div></div>
  <div class="hint" id="hint">Toca para pausar</div>
</div>

<script>
(function(){
  'use strict';

  /* ============ datos ============ */
  // Los tiempos son DESCANSOS. La serie no se cronometra: dura lo que dure.
  var TIMES  = [15,30,45,60,75,90,105,120,135,150,165,180];
  var SERIES = [1,2,3,4,5,6,7,8,10,12,15,20];

  var sIdx = +(localStorage.getItem('gt.s') || 0);
  if (!(sIdx >= 0 && sIdx < SERIES.length)) sIdx = 0;
  var serie = 1;                    // serie que toca hacer ahora

  var $ = function(id){ return document.getElementById(id); };
  function fmt(s){
    s = Math.max(0, Math.ceil(s - 0.0001));
    var m = Math.floor(s/60), r = s%60;
    return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
  }

  /* ============ audio ============ */
  /* Los avisos se programan por adelantado en el Web Audio API: suenan a su
     hora aunque el navegador congele los temporizadores en segundo plano. */
  var ctx = null, master = null, nodes = [], alive = null;

  function audio(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx){
      // iOS 16.4+: 'playback' hace que suene aunque el móvil esté en silencio
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 1;
      var comp = ctx.createDynamicsCompressor();   // más volumen percibido
      master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Un bucle mudo mantiene viva la sesión de audio de iOS mientras corre la
  // cuenta atrás, para que los avisos programados no se queden por el camino.
  function keepAudioAlive(on){
    if (!ctx) return;
    if (on && !alive){
      var b = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate/2)), ctx.sampleRate);
      var s = ctx.createBufferSource();
      s.buffer = b; s.loop = true; s.connect(master); s.start();
      alive = s;
    } else if (!on && alive){
      try{ alive.stop(); }catch(e){}
      alive = null;
    }
  }

  function beep(at, dur, freq, vol){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = freq;   // valor directo: no depende de la línea temporal del parámetro
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
    g.gain.setValueAtTime(vol, at + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.03);
    nodes.push(o);
  }
  function silence(){
    for (var i=0;i<nodes.length;i++){ try{ nodes[i].stop(); }catch(e){} }
    nodes = [];
  }

  var AVISO_30 = 30;      // aviso a falta de 30 s
  var TICKS    = 5;       // tic-tic-tic-tic-tic en los últimos 5 s
  var GO_DUR   = 2.4;     // pitido largo de "ya, a entrenar"

  // Programa todos los avisos de un descanso de `secs` segundos.
  function programarAvisos(secs){
    if (!audio()) return;
    var fin = ctx.currentTime + secs;
    if (secs > AVISO_30 + 2){                       // aviso de media: dos pitidos
      beep(fin - AVISO_30,        .13, 520, .55);
      beep(fin - AVISO_30 + 0.22, .13, 520, .55);
    }
    for (var i = TICKS; i >= 1; i--){               // cuenta atrás
      if (secs > i + 0.3) beep(fin - i, .10, 700, .75);
    }
    beep(fin, GO_DUR, 1100, .95);                   // ¡YA!
  }

  function probarSonido(){
    var c = audio();
    var b = $('snd'), t = $('sndTxt');
    if (!c){ b.className = 'ctrl ko'; t.textContent = '✕ SIN AUDIO'; return; }
    silence();
    beep(c.currentTime + 0.02, .10, 700, .75);
    beep(c.currentTime + 0.32, .10, 700, .75);
    beep(c.currentTime + 0.62, 1.1, 1100, .95);
    setTimeout(function(){
      var ok = ctx.state === 'running';
      b.className = 'ctrl ' + (ok ? 'ok' : 'ko');
      t.textContent = ok ? '🔊 ¿SE OYE?' : '✕ BLOQUEADO';
    }, 250);
  }

  function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

  /* ============ pantalla encendida ============ */
  var wl = null;
  function keepAwake(on){
    if (on){
      if (navigator.wakeLock && !wl) navigator.wakeLock.request('screen').then(function(l){ wl = l; }).catch(function(){});
    } else if (wl){
      try{ wl.release(); }catch(e){}
      wl = null;
    }
  }

  /* ============ descanso ============ */
  var run = null;   // {dur, endAt, paused, left, ended, go}
  var to = null, raf = null, acc = '';
  var elRun = $('run'), elBig = $('big'), elRing = $('ring'), elPhase = $('phase'), elHint = $('hint');

  function empezarDescanso(secs){
    audio();                        // este toque desbloquea el sonido
    keepAudioAlive(true);
    run = { dur:secs, endAt:performance.now() + secs*1000, paused:false, left:0, ended:false, go:false };
    elRun.hidden = false;
    elRun.classList.remove('paused');
    elBig.classList.remove('go');
    keepAwake(true);
    silence();
    programarAvisos(secs);
    clearTimeout(to); to = setTimeout(finDescanso, secs*1000);
    setAcc('var(--work)');
    pintar(true);
    cancelAnimationFrame(raf); raf = requestAnimationFrame(bucle);
  }

  function finDescanso(){
    if (!run || run.ended) return;
    run.ended = true; run.go = true;
    clearTimeout(to);
    buzz([200,90,200]);
    setAcc('var(--work)');
    pintar(true);
    // el pitido largo suena solo y el temporizador se para solo:
    // te quedas listo para la siguiente serie sin tocar la pantalla.
    to = setTimeout(function(){
      if (serie < SERIES[sIdx]) serie++;
      else serie = 1;
      parar();
    }, GO_DUR*1000 + 200);
  }

  function setAcc(c){ if (c !== acc){ acc = c; elRun.style.setProperty('--acc', c); } }

  function pintar(forzar){
    if (!run) return;
    if (run.go){
      elPhase.textContent = 'A ENTRENAR';
      elBig.textContent = '¡YA!';
      elBig.classList.add('go');
      elRing.style.setProperty('--p', 1);
      elHint.textContent = 'Se para solo';
      return;
    }
    var left = run.paused ? run.left : (run.endAt - performance.now());
    if (left < 0) left = 0;
    elBig.textContent = fmt(left/1000);
    elRing.style.setProperty('--p', run.dur ? (left/1000)/run.dur : 0);
    setAcc(left <= TICKS*1000 ? 'var(--warn)' : 'var(--work)');
    if (forzar){
      elPhase.innerHTML = SERIES[sIdx] > 1
        ? 'DESCANSO · SERIE <b>' + serie + '</b> / ' + SERIES[sIdx]
        : 'DESCANSO';
    }
    elHint.textContent = run.paused ? 'PAUSA · toca para seguir' : 'Toca para pausar';
  }

  function bucle(){
    if (!run) return;
    if (!run.paused && !run.go){
      pintar(false);
      if (performance.now() >= run.endAt) finDescanso();   // por si el navegador frena el timer
    }
    raf = requestAnimationFrame(bucle);
  }

  function pausa(){
    if (!run || run.go) return;
    if (run.paused){
      run.paused = false;
      run.endAt = performance.now() + run.left;
      silence(); programarAvisos(run.left/1000);
      clearTimeout(to); to = setTimeout(finDescanso, run.left);
      elRun.classList.remove('paused');
      keepAwake(true); keepAudioAlive(true);
    } else {
      run.paused = true;
      run.left = Math.max(0, run.endAt - performance.now());
      silence(); clearTimeout(to);
      elRun.classList.add('paused');
      keepAudioAlive(false);
    }
    pintar(true);
  }

  function parar(){
    silence(); clearTimeout(to); cancelAnimationFrame(raf);
    keepAudioAlive(false);
    run = null; raf = null;
    elRun.hidden = true;
    elRun.classList.remove('paused');
    keepAwake(false);
    pintarAjustes();
  }

  /* ============ interfaz ============ */
  var grid = $('grid');
  TIMES.forEach(function(s){
    var b = document.createElement('button');
    b.className = 't';
    b.textContent = fmt(s);
    b.addEventListener('click', function(){ empezarDescanso(s); });
    grid.appendChild(b);
  });

  function pintarAjustes(){
    var n = SERIES[sIdx];
    if (n > 1){
      $('lS').textContent = 'SERIE';
      $('vS').textContent = serie + '/' + n;
      $('vS').className = 'val';
    } else {
      $('lS').textContent = 'SERIES';
      $('vS').textContent = 'OFF';
      $('vS').className = 'val off';
    }
    localStorage.setItem('gt.s', sIdx);
  }

  document.querySelectorAll('.step').forEach(function(b){
    b.addEventListener('click', function(){
      sIdx = Math.min(SERIES.length-1, Math.max(0, sIdx + (+b.dataset.d)));
      serie = 1;
      pintarAjustes();
      buzz(8);
    });
  });
  pintarAjustes();

  $('snd').addEventListener('click', probarSonido);
  elRun.addEventListener('click', pausa);
  $('stop').addEventListener('click', function(e){ e.stopPropagation(); parar(); });
  document.addEventListener('keydown', function(e){
    if (e.code === 'Escape' && run) parar();
    else if (e.code === 'Space' && run){ e.preventDefault(); pausa(); }
  });
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && run && !run.paused){
      keepAwake(true);
      if (performance.now() >= run.endAt) finDescanso();
    }
  });
  // desbloquea el audio en cuanto toques cualquier cosa
  document.addEventListener('pointerdown', function armar(){
    audio();
    if (ctx && ctx.state === 'running') document.removeEventListener('pointerdown', armar);
  });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
